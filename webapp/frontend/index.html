<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meridian — Demostración privada</title>
  <meta name="description" content="Meridian es un motor de proyección propietario, desarrollado internamente." />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23F2EFE7'/><rect x='2.5' y='2.5' width='27' height='27' fill='none' stroke='%238C7238' stroke-width='1'/><text x='16' y='23' font-family='Georgia,serif' font-size='18' fill='%231B1A17' text-anchor='middle'>M</text></svg>" />
</head>
<body>

  <div class="topbar">
    <div class="wrap topbar-inner">
      <a class="wordmark" href="/">
        <span class="wordmark-mark">M</span>
        <span class="wordmark-text">
          <b id="brand">Meridian</b>
          <i id="brand-suffix">Proyecciones</i>
        </span>
      </a>
      <div class="topbar-meta">
        <span id="engine-badge" class="engine-badge">Motor · iniciando</span>
        <div class="lang-toggle" id="lang-toggle" role="group">
          <button type="button" data-lang="es">ES</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </div>

  <header class="masthead">
    <div class="wrap">
      <p class="eyebrow" data-i18n="hero.eyebrow">Demostración privada</p>
      <h1 data-i18n-html="hero.title">El trimestre que viene,<br /><em>cuantificado.</em></h1>
      <div class="rule-double" aria-hidden="true"></div>
      <p class="deck" data-i18n="hero.deck"></p>
      <dl class="credentials">
        <div><dt data-i18n="cred.method.t"></dt><dd data-i18n="cred.method.d"></dd></div>
        <div><dt data-i18n="cred.prep.t"></dt><dd data-i18n="cred.prep.d"></dd></div>
        <div><dt data-i18n="cred.deliver.t"></dt><dd data-i18n="cred.deliver.d"></dd></div>
      </dl>
      <p class="rate-info" id="rate-info"></p>
    </div>
  </header>

  <main class="wrap">

    <!-- I. DATA -->
    <section class="panel">
      <div class="panel-head">
        <span class="numeral">I</span>
        <div>
          <h2 data-i18n="p1.title"></h2>
          <p class="panel-note" id="limits-line"></p>
        </div>
      </div>

      <div class="data-grid">
        <div>
          <h3 class="label" data-i18n="p1.prepared"></h3>
          <div id="sample-list" class="sample-list"></div>
        </div>
        <div>
          <h3 class="label" data-i18n="p1.own"></h3>
          <label class="dropzone" id="dropzone">
            <input type="file" id="file-input" accept=".csv,text/csv" hidden />
            <span class="dz-rule"></span>
            <span class="dz-title" data-i18n="p1.dz.title"></span>
            <span class="dz-sub" data-i18n-html="p1.dz.sub"></span>
          </label>
          <p class="panel-note" id="upload-hint"></p>
        </div>
      </div>

      <div id="data-status" class="data-status"></div>
    </section>

    <!-- II. CONFIGURE -->
    <section class="panel" id="config-card" hidden>
      <div class="panel-head">
        <span class="numeral">II</span>
        <div>
          <h2 data-i18n="p2.title"></h2>
          <p class="panel-note" data-i18n="p2.note"></p>
        </div>
      </div>

      <div class="controls">
        <div class="control">
          <label class="label" for="target-col" data-i18n="p2.target"></label>
          <select id="target-col"></select>
        </div>
        <div class="control">
          <label class="label" for="date-col">
            <span data-i18n="p2.period"></span>
            <span class="opt" data-i18n="p2.optional"></span>
          </label>
          <select id="date-col"></select>
        </div>
        <div class="control control-wide">
          <label class="label" for="horizon" id="horizon-label"></label>
          <input type="range" id="horizon" min="1" max="128" value="24" />
        </div>
        <div class="control control-wide">
          <span class="label" data-i18n="p2.method"></span>
          <div class="segmented" id="mode-seg">
            <button data-mode="future" class="active">
              <b data-i18n="p2.mode.future"></b><i data-i18n="p2.mode.futureSub"></i>
            </button>
            <button data-mode="backtest">
              <b data-i18n="p2.mode.backtest"></b><i data-i18n="p2.mode.backtestSub"></i>
            </button>
          </div>
        </div>
        <div class="control control-wide checkbox">
          <label>
            <input type="checkbox" id="nonneg" checked />
            <span data-i18n-html="p2.nonneg"></span>
          </label>
        </div>
      </div>

      <div class="panel-foot">
        <button id="run-btn" class="btn-primary" data-i18n="p2.run"></button>
        <p class="panel-note" id="mode-hint"></p>
      </div>
    </section>

    <!-- III. RESULT -->
    <section class="panel" id="result-card" hidden>
      <div class="panel-head">
        <span class="numeral">III</span>
        <div>
          <h2 data-i18n="p3.title"></h2>
          <p class="panel-note" id="result-engine"></p>
        </div>
      </div>

      <div id="metrics" class="metrics"></div>

      <figure class="chart-figure">
        <div class="chart-holder"><div id="chart"></div></div>
        <figcaption class="chart-caption">
          <p id="chart-explain"></p>
          <p id="chart-interact" class="chart-interact"></p>
        </figcaption>
      </figure>

      <div class="panel-foot panel-foot-split">
        <button id="download-btn" class="btn-secondary" data-i18n="p3.download"></button>
        <button id="png-btn" class="btn-secondary" data-i18n="chart.savePng"></button>
        <button id="svg-btn" class="btn-secondary" data-i18n="chart.saveSvg"></button>
      </div>
    </section>

    <!-- IV. PRICING -->
    <section class="panel">
      <div class="panel-head">
        <span class="numeral">IV</span>
        <div>
          <h2 data-i18n="pricing.title"></h2>
          <p class="panel-note" data-i18n="pricing.note"></p>
        </div>
      </div>
      <div class="pricing-grid" id="pricing-grid"></div>
      <ul class="pricing-fine" id="pricing-fine"></ul>
    </section>

    <!-- ENGAGEMENT -->
    <section class="panel panel-engage">
      <div class="panel-head">
        <span class="numeral">&#167;</span>
        <div>
          <h2 data-i18n="eng.title"></h2>
          <p class="panel-note" data-i18n="eng.note"></p>
        </div>
      </div>

      <dl class="perks">
        <div><dt data-i18n="eng.scale.t"></dt><dd data-i18n="eng.scale.d"></dd></div>
        <div><dt data-i18n="eng.vars.t"></dt><dd data-i18n="eng.vars.d"></dd></div>
        <div><dt data-i18n="eng.watch.t"></dt><dd data-i18n="eng.watch.d"></dd></div>
        <div><dt data-i18n="eng.integr.t"></dt><dd data-i18n="eng.integr.d"></dd></div>
        <div><dt data-i18n="eng.calib.t"></dt><dd data-i18n="eng.calib.d"></dd></div>
        <div><dt data-i18n="eng.advisory.t"></dt><dd data-i18n="eng.advisory.d"></dd></div>
      </dl>

      <div class="panel-foot">
        <a id="contact-cta" class="btn-primary" href="#" data-i18n="eng.cta"></a>
        <p class="panel-note" data-i18n="eng.ctaNote"></p>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="wrap">
      <div class="rule-double" aria-hidden="true"></div>
      <div class="footer-inner">
        <p class="footer-mark">
          <b id="footer-brand">Meridian</b> <span id="footer-est">MMXXVI</span>
        </p>
        <p class="footer-legal" data-i18n="footer.legal"></p>
      </div>
    </div>
  </footer>

  <div id="toast" class="toast" hidden></div>
  <!-- ECharts, Apache-2.0, served locally: no third-party request from this page -->
  <script src="/vendor/echarts.min.js"></script>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
